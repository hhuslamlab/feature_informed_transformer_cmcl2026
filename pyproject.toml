[project]
name = "feature_invariant_transformer"
version = "0.1.0"
description = "Feature invariant transformer implementation"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "huggingface-hub>=0.34.4",
    "transformers>=4.56.0",
    "datasets>=4.0.0",
    "wandb>=0.21.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
