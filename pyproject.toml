[project]
name = "feature-informed"
version = "0.1.0"
description = "Transformer-based models for Spanish verb morphological inflection with different feature representations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=1.9.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scikit-learn>=0.24.0",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
    "tikzplotlib>=0.10.0",
    "docopt>=0.6.2",
]

[dependency-groups]
test = ["pytest>=7.0"]
